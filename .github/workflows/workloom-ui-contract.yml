name: workloom-ui-contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ui-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      WORKLOOM_DIR: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: corepack enable && corepack prepare pnpm@10.14.0 --activate
      - name: 私有 UI 制品校验与原锁安装
        env:
          WORKLOOM_UI_RELEASE_READ_TOKEN: ${{ secrets.CNB_UI_RELEASE_TOKEN }}
        run: >-
          node "$WORKLOOM_DIR/scripts/ci/install-private-ui.mjs"
          --repo "$WORKLOOM_DIR"
          --store-dir "$RUNNER_TEMP/workloom-ui-store"
          --staging-root "$RUNNER_TEMP"
          --archive "$RUNNER_TEMP/workloom-ui-original.tgz"
          --report "$RUNNER_TEMP/workloom-ui-bootstrap.json"
      - name: UI 下载与安装边界回归
        env:
          WORKLOOM_UI_TEST_ARCHIVE_PATH: ${{ runner.temp }}/workloom-ui-original.tgz
        run: node --test --test-concurrency=1 scripts/ci/ui-auth-bootstrap.test.mjs scripts/ci/install-private-ui.test.mjs
      # Apply the existing fleet fork policy; foundation fingerprints and downstream tests stay strict.
      - name: 禁止 UI 分叉并校验三端版本（分叉仓按既有规范记录告警）
        run: |
          set -uo pipefail
          if OUT="$(node "$WORKLOOM_DIR/scripts/verify-ui-consumer.mjs" --repo "$WORKLOOM_DIR" --require-governance-state 2>&1)"; then
            echo "$OUT"
            exit 0
          fi
          echo "$OUT"
          printf '%s\n' "$OUT" | node "$WORKLOOM_DIR/.github/scripts/ui-consumer-fork-advisory.mjs" --repo "$WORKLOOM_DIR"
      - name: 分叉仓告警分类器自检
        run: node "$WORKLOOM_DIR/.github/scripts/ui-consumer-fork-advisory.mjs" --self-test
      - name: 校验三端应用壳指纹与行业扩展边界
        run: node "$WORKLOOM_DIR/scripts/verify-client-foundation-consumer.mjs" --repo "$WORKLOOM_DIR"
      - name: 校验产品身份与全量行业包治理
        run: |
          (cd "$WORKLOOM_DIR" && node scripts/verify-product-content.mjs)
          (cd "$WORKLOOM_DIR" && pnpm exec tsx scripts/bundle-governance.mts)
      # 媒体夹具执行真实加工，测试前需要 ffmpeg 和 ffprobe。
      - name: 媒体工具（ffmpeg/ffprobe）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: 执行仓库已有测试
        run: |
          set -euo pipefail
          pnpm -C "$WORKLOOM_DIR" test
          if [ -f requirements.txt ] && [ -d tests ] && find tests -type f -name 'test_*.py' -print -quit | grep -q .; then
            python -m pip install --disable-pip-version-check -r requirements.txt
            python -m pytest -q
          fi
      - name: 三端逐一类型检查与生产构建
        run: |
          set -euo pipefail
          for CLIENT in web webb webc; do
            test -f "$WORKLOOM_DIR/apps/$CLIENT/package.json"
            pnpm -C "$WORKLOOM_DIR/apps/$CLIENT" typecheck
            pnpm -C "$WORKLOOM_DIR/apps/$CLIENT" build
          done
      - name: 安装 Chromium
        run: pnpm -C "$WORKLOOM_DIR/apps/web" exec playwright install --with-deps chromium
      - name: 三端生产预览主入口与首帧横向溢出冒烟
        run: CI=true pnpm -C "$WORKLOOM_DIR/apps/web" test:consumer
      - name: 留存三端浏览器冒烟证据
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workloom-ui-consumer-${{ github.run_id }}
          path: |
            ./apps/web/playwright-report/consumer
            ./apps/web/test-results/consumer
          if-no-files-found: warn
          retention-days: 30
