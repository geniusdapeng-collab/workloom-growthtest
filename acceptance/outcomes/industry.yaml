{
  "schemaVersion": "workloom.outcome-suite/v1",
  "role": "data-board-officer",
  "agentPreset": "data-board-officer",
  "trials": 5,
  "businessScope": "隔离社媒指标核查",
  "deliverableUnit": "隔离社媒指标核查清单",
  "minimumSubstance": "四项指标来源、基线、异常线索与未核实项；模拟数据不进入真实增长指标",
  "notes": "正常任务仅请求行业核查摘要，禁止执行实际业务写入；执行器仍会创建带 marker 的验收线程。配置有效不证明经营指标、生产能力或完整RDAS通过。",
  "tasks": [
    {
      "id": "INDUSTRY-NORMAL",
      "scenario": "normal",
      "criticality": "P0",
      "title": "隔离社媒指标核查",
      "input": "当前隔离实验中的社媒播放、涨粉、互动、询盘四项指标如何核查基线和工具回执？请用“社媒”标注未核实数字与异常线索，只回答检查清单，不处置告警或改动投放。",
      "trials": 5,
      "thread_asserts": [
        {
          "field": "preset_key",
          "equals": "data-board-officer"
        }
      ],
      "event_asserts": [
        {
          "action": "ask.answer",
          "field": "decision.after.text",
          "contains": "社媒",
          "minLength": 12
        }
      ],
      "receipt": {
        "require": true,
        "source": "thread-events"
      }
    },
    {
      "id": "INDUSTRY-FAILURE",
      "scenario": "failure",
      "criticality": "P0",
      "title": "隔离社媒指标核查：公开入口拒绝超长标题",
      "input": "超长输入应在创建线程前拒绝。",
      "trials": 1,
      "invalidInput": "title-too-long",
      "expect": {
        "status": 400,
        "code": "BAD_REQUEST",
        "noThreadCreated": true
      }
    },
    {
      "id": "INDUSTRY-PERMISSION",
      "scenario": "permission",
      "criticality": "P0",
      "title": "隔离社媒指标核查：无身份派单拒绝",
      "input": "无身份派单应拒绝且不得创建线程。",
      "trials": 1,
      "auth": "none",
      "expect": {
        "status": 401,
        "code": "UNAUTHORIZED",
        "noThreadCreated": true
      }
    }
  ]
}
