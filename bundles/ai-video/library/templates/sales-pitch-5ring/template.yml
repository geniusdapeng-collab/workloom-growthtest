# 销售讲解型营销片（sales-pitch-5ring）· v1.0 · 2026-09-26
#
# 来源：真机交付 T-2026-0926-0007（VID-GR01《WorkLoom 获客增长系统 · 85 秒销售片》）。
# 一句话口径：**一个主讲人、一条台词线、五段结构**——痛点三笔账 → 主张翻转 → 能力五环 →
# 证据（战报）→ 邀约；屏幕类画面的文字一律虚化，卖点只由台词与字幕承担。
template_key: sales-pitch-5ring
name: 销售讲解型营销片（五环结构）
version: v1.0
owner: director
description: 80–95 秒的 B 端销售讲解片：单一主讲人出镜贯穿全片，逐镜台词覆盖，
  以"痛点 → 主张 → 能力 → 证据 → 邀约"五段推进，收口到可执行的下一步（免费体检/预约演示）。
platforms: [小红书, 抖音, 视频号, 线下投屏]
aspect_presets: ["9:16", "16:9"]
duration_band: [80, 95]

# ── 一、结构（段落 → 镜头任务） ───────────────────────────────────────────
structure:
  - { segment: pain, ratio: [0.00, 0.28], intent: 三笔旧账 + 一笔新账（成本/流失/抽成/新入口），开场即追问 }
  - { segment: claim, ratio: [0.28, 0.50], intent: 主张翻转：买的不是工具，是一支能打仗的获客班组 }
  - { segment: rings, ratio: [0.50, 0.73], intent: 能力五环逐环落地，每环一句可验证的话 }
  - { segment: proof, ratio: [0.73, 0.90], intent: 硬实力 + 战报数字（模拟演示须显式标注语境） }
  - { segment: invite, ratio: [0.90, 1.00], intent: 低成本下一步 + 品牌收尾 }

# ── 二、镜头类型库 ───────────────────────────────────────────────────────
shot_types:
  - id: presenter-hook
    name: 主讲人追问开场
    task: 开场 5 秒内抛出痛点反问，直视镜头
    camera: 中景快推至中近景后稳住（手持呼吸感）
    gate: 人物与定妆照同一张脸；台词 ≤ 时长 × 2.8 字
  - id: dramatized-pain
    name: 痛点戏剧化（主讲人出演）
    task: 把成本账单/深夜询盘/佣金抽成演成一个具体动作
    camera: 俯拍/横移/浅景深推近
    gate: 屏幕内容过曝或虚化成色块，版面内禁止可辨认文字
  - id: claim-turn
    name: 主张翻转
    task: 一句话立起立场（"别再买工具…"）
    camera: 稳定器跟随前移，人物走到位停住
    gate: 构图留出标题安全区；口播镜之间保持硬切
  - id: capability-ring
    name: 能力环（每环一镜）
    task: 一环一句，动作与画面道具必须能证明这句话
    camera: 横移/过肩/环绕，节奏均匀
    gate: 屏幕与白板不出现可辨认文字与数字
  - id: proof-report
    name: 战报证据
    task: 用手势划出上升趋势，屏幕只保留柱体与曲线
    camera: 侧后方横移到侧前方
    gate: 模拟数据必须在文案或口播里标注语境；屏幕不出现可读数字
  - id: invite-cta
    name: 邀约收尾
    task: 给一个低风险下一步（免费体检/预约演示），并落在品牌名上
    camera: 机位下降推近 → 后拉留字位
    gate: 收尾镜需留品牌字位；口播语速放缓

# ── 三、台词预算（交付闸口径，不可放宽） ─────────────────────────────────
dialogue_budget:
  rule: 单镜台词字数（去标点）≤ 镜头时长 × 2.8
  derivation: 时长 × 80%（台词占比上限） × 3.5 字每秒（中文舒适语速）
  note: 18 镜 × 4.5–5.5s 的 85–90s 片子，台词总量约 230–250 字；宁可留白，不要赶语速

# ── 四、剪辑与声音 ───────────────────────────────────────────────────────
editing:
  cut_transition:
    default: 无（全片硬切）
    note: >-
      真机结论（VID-GR01）：逐刀转场会按刀数吃掉时长（hblur 0.18s × 刀数），
      剪辑点随之偏离 0.5s 网格，配乐的"卡点"指标即失真（实测 17 个切点只有 7–8 个落在 ±80ms 内）。
      口播型销售片以硬切为默认；确需甩镜转场时，要么接受卡点指标降级，
      要么给转场点**之后**的镜头补足等长时长（每刀 +0.18s），把网格重新对齐。
    optional: { name: hblur, durationSec: 0.18, at: 段落交界 }
  xfade: 0.3
  rule: 全片硬切（保住力量感 + 卡点可精确对齐）；转场仅作可选风格件
voice:
  profile: chen-zhuo-film
  rule: 全片同一音色；每镜台词必须有人声（ASR 复核，不通过则配音工位补旁白）
bgm:
  family: 企业宣传/干净可信题材纯器乐（120BPM 族；真机用 corporate-clean-track-577）
  ducking: 人声优先，音乐床低电平让位（-28dB / 让位 16dB）
  hard_rules:
    - 必须把**曲目真实 BPM** 交给混音器（`--bgm-bpm`）：缺省时基准会落到 100，反推 BPM 失真
    - 剪辑点用硬切网格（0.5s 倍数）→ 120BPM 音乐床可做到 17/17 卡点、平均误差 0ms
    - 音乐床只从曲库选（禁止现场自算作曲）

# ── 五、交付包 ───────────────────────────────────────────────────────────
delivery:
  master: 干净母版（不烧字）
  subtitles: 旁挂 srt/ass/vtt + 软字幕轨副本（可选烧字副本）
  variants: 3 个风格变体（同一组镜头，只做后期层派生：调色/配乐/转场/封面/文案）
  cover: 人物主导版式（person-led），标题钩子 ≤ 6 字
  manifest: delivery-manifest.json（全产物 sha256 + 变体差异实测 + 成本口径）

# ── 六、真机打回清单（照抄必踩；来自 VID-GR01 的 11 次打回） ─────────────
anti_patterns:
  - id: identity-drift
    symptom: 关键帧人脸/发型与定妆照不一致（侧脸、半身、手部为主体的镜头最易漂）
    fix: 卡片里把面部写进构图与景深（"面部位于画面左上且被屏幕光照亮"），并把档案里的五官特征逐项写进【角色】
  - id: costume-conflict
    symptom: 卡片写西装、定妆照是旗袍 → 监制判"服装与定妆照不符"连续打回
    fix: 服装以角色档案为准（本仓 1 号模特 w1 月白旗袍）；要换装需先给档案补造型与定妆照
  - id: hand-anatomy
    symptom: 手部特写出现多余手臂/指节畸变
    fix: 卡片显式声明"画面中只有一只手入画"，负面约束补"第二只手、手臂来源不清、手指畸变"；必要时把手势降级为肩背动作
  - id: screen-text
    symptom: 屏幕出现可辨认文字/乱码/伪文字水印
    fix: 构图写"屏幕过曝或虚化成色块"、负面约束补"屏幕文字/界面文案/UI 标签"
  - id: glass-mirror-face
    symptom: 幕墙/玻璃倒影里出现第二张脸（身份不符）
    fix: 换到露台/无镜面场景，负面约束补"玻璃倒影、镜像人像、第二张人脸"
  - id: scene-silently-replaced
    symptom: 卡片写"夜街霓虹/投影"等词，vendor 写实校验把【场景】整段替换成中立模板（如"简约室内房间…"），成图与卡片不符
    fix: 避开写实禁用词（霓虹/投影/全息/虚拟/元宇宙…）；管线已在 spec 阶段零 token 检出并留痕（`sceneSubstituted`）
