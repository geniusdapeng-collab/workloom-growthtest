# 成片调色围栏包（视频经理 · 调色工位）
# 与 ai-video-baseline.yml 同口径：默认基线、只可加严、命中取严（block > review > auto）；
# 求值语义：匹配命中后求值 when（沙箱，禁任意代码），写类动作无命中按 default_level。
version: ai-video-color/v1
default_level: review
rules:
  - rule_id: G-COL0
    name: 常规调色直通（本地可逆动作）
    level: auto
    is_baseline: true
    match:
      object_types: [final_video, color_report, video_asset]
      actions: [colorwrite.grade, colorwrite.match]
    when: "true"
    note: 本地单次调色默认直通，按调用方请求执行真实滤镜并记录源/产物 SHA 和普通元数据；不抽帧评分或因原片观感触发重生成。源覆盖与租户配额规则保留。

  - rule_id: G-COL1
    name: 已生成镜头调色不设品牌观感人审
    level: review
    is_baseline: true
    match:
      object_types: [color_report, final_video]
      actions: [color.look.change, colorwrite.grade]
    when: "false"
    note: 兼容既有规则 ID 与绑定。look_change/lut_approved 不构成后期品质准入；显式调色请求执行一次，LUT 路径、声明资产存在性与真实编码错误仍须处理。

  - rule_id: G-COL2
    name: 覆盖原片禁止
    level: block
    is_baseline: true
    match:
      object_types: [final_video, video_asset]
      actions: [colorwrite.grade]
    when: "params.overwrite_source == true or (contains_any(params.output_path, ['/', '.', '\\']) and params.output_path == params.input_path)"
    note: 原片只读是硬红线：调色一律产出新文件并进版本链，任何覆盖原片的调用一票否决

  - rule_id: G-COL3
    name: 调色默认不设指标质量闸
    level: block
    is_baseline: true
    match:
      object_types: [final_video, color_report]
      actions: [colorwrite.grade]
    when: "false"
    note: 兼容既有规则 ID 与绑定。skip_verify/verify=false 仅不请求品质诊断，不阻断后期；真实变换、实际产物、源 SHA 与错误回执始终记录。

  - rule_id: G-COL4
    name: 单租户日调色配额熔断
    level: block
    is_baseline: true
    match:
      object_types: [final_video, render_job]
      actions: [colorwrite.grade, colorwrite.match]
    when: "context.tenant_daily_grades >= 30"
    note: 每租户每日 30 次调色上限（含匹配），超限熔断并告警；上调须人审（工位产能与成本保护）
