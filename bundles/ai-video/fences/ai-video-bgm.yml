# 成片配乐围栏包（视频经理 · 配乐工位）
# 与 ai-video-baseline.yml / ai-video-color.yml 同口径：默认基线、只可加严、命中取严（block > review > auto）；
# 求值语义：匹配命中后求值 when（沙箱，禁任意代码），写类动作无命中按 default_level。
version: ai-video-bgm/v1
default_level: review
rules:
  - rule_id: G-BGM0
    name: 常规配乐直通（本地可逆动作）
    level: auto
    is_baseline: true
    match:
      object_types: [final_video, bgm_report, video_asset, bgm_track]
      actions: [bgmwrite.compose, bgmwrite.mix, bgmwrite.separate, bgmwrite.best]
    when: "true"
    note: 成片配乐是工位本地、非破坏性、可回滚动作（原片只读 + 新文件 + 版本链），默认直通；曲库首次入片（G-BGM1）、覆盖原片（G-BGM2）、丢弃原声（G-BGM3）、日配额（G-BGM4）、版权不合规（G-BGM5）叠加升级，deny 优先并集取严。未命中写动作的保守默认是 review，故此处必须显式声明 auto，否则干净配乐也被挂起。

  - rule_id: G-BGM1
    name: 曲库首次入片 / 品牌主题曲变更必审
    level: review
    is_baseline: true
    match:
      object_types: [bgm_report, final_video, bgm_track]
      actions: [bgmwrite.mix, bgmwrite.best]
    when: "params.license_reviewed == false or params.theme_change == true"
    note: 新曲库/新平台的第一支曲目入片、或改动品牌主题曲，属对外观感与法律风险变更，须人审（审批号随配乐报告归档）；已核验许可的曲目复用自动放行。

  - rule_id: G-BGM2
    name: 覆盖原片禁止
    level: block
    is_baseline: true
    match:
      object_types: [final_video, video_asset]
      actions: [bgmwrite.mix, bgmwrite.compose, bgmwrite.best]
    when: "params.overwrite_source == true or params.output_path == params.input_path"
    note: 原片只读是硬红线：配乐一律产出新文件并进版本链（视频轨 copy 不改画面），任何覆盖原片的调用一票否决。

  - rule_id: G-BGM3
    name: 人声保护与「禁止静音原声」
    level: block
    is_baseline: true
    match:
      object_types: [final_video, bgm_report]
      actions: [bgmwrite.mix, bgmwrite.best]
    when: "params.skip_verify == true or params.verify == false or params.mute_dialogue == true or (params.policy == \"music-only\" and params.allow_discard_original != true) or params.remove_vocals_full == true"
    note: 两条硬线：① 配乐必须带复检（响度/人声余量/配乐可闻度），关闭校验的调用禁止执行（无回执=未核实）；② 不许把"声音全去掉再盖音乐"当默认做法——丢弃原声（含人声）必须显式声明 allow_discard_original=true，且不得声称为标准流程。

  - rule_id: G-BGM4
    name: 单租户日配乐配额熔断
    level: block
    is_baseline: true
    match:
      object_types: [final_video, render_job]
      actions: [bgmwrite.mix, bgmwrite.best, bgmwrite.compose]
    when: "context.tenant_daily_bgm >= 40"
    note: 每租户每日 40 次配乐上限（含作曲/混音/择优），超限熔断并告警；上调须人审（工位产能与成本保护）。

  - rule_id: G-BGM5
    name: 版权不合规禁止入片
    level: block
    is_baseline: true
    match:
      object_types: [bgm_track, bgm_report]
      actions: [bgmwrite.mix, bgmwrite.best]
    when: "params.commercial_use == true and not contains_any(params.track_license, ['cc0-1.0', 'cc-by-4.0', 'cc-by-sa-4.0', 'royalty-free', 'workloom-self-generated'])"
    note: "商用交付只允许 CC0 / CC BY / CC BY-SA / 明确可商用的免版税曲目；NC/ND/未标注一律一票否决（自算作曲属本仓产物，许可为 workloom-self-generated，命中白名单豁免）。DSL 语义：contains_any 的 haystack 非字符串（含字段缺失）→ false → 条件成立 → 阻断，即「没登记许可」按不合规处理（fail-closed）。"

  - rule_id: G-BGM6
    name: 在线取源首次启用 / 新曲源必审
    level: review
    is_baseline: true
    match:
      object_types: [bgm_track, bgm_report]
      actions: [bgmwrite.fetch, bgmwrite.best]
    when: "params.new_provider == true or params.provider_reviewed == false"
    note: 首次启用某个在线曲源（Jamendo / Freesound / Mubert / 客户自建索引）或更换 provider 时，须人审确认授权范围、商用口径与署名义务；已核验过的 provider 复用自动放行（params.provider_reviewed=true）。

  - rule_id: G-BGM7
    name: 未登记曲源 / 非 http(s) 取源禁止
    level: block
    is_baseline: true
    match:
      object_types: [bgm_track, bgm_report]
      actions: [bgmwrite.fetch]
    when: "params.allow_unlicensed_source == true or params.unregistered_source == true or params.url_scheme_ok == false"
    note: 在线取源只允许已登记 provider 与客户自建索引（generic-http），且只接受 http(s)；任何"未知域/绕过鉴权/允许未授权源"的调用一票否决。连接器层同时做协议校验与体积上限（双保险）。

  - rule_id: G-BGM8
    name: 曲库打标必须声明许可 / 不许覆盖既有曲库
    level: block
    is_baseline: true
    match:
      object_types: [bgm_track, bgm_report, video_asset]
      actions: [bgmwrite.tag, bgmwrite.library]
    when: "params.license_declared == false or params.license_ok == false or params.overwrite_existing == true or params.out_dir_inside_source == true"
    note: 打标是把外部素材**写进可交付曲库**的动作，两道硬闸：① 没有许可声明（或声明的许可不在可商用白名单）一票否决——来源不明的音频不许入册；② 目标目录已有曲库索引（tracks.json）而调用未显式 allow_overwrite=true 一票否决，避免一次误调用冲掉客户积累的曲库；③ 输出目录落在素材目录内部（会把索引混进素材包）同样阻断。连接器层（bgmwrite.tag / bgmwrite.library 的 rebind·pack）对这三条做同等校验，双保险。

  - rule_id: G-BGM9
    name: 低置信标签入册须人审复核
    level: review
    is_baseline: true
    match:
      object_types: [bgm_track, bgm_report]
      actions: [bgmwrite.tag]
    when: "params.low_confidence_count >= 1"
    note: 风格族/拍速把握不足（confidence=low）的曲目**允许**入册并照常用作兜底，但用于客户交付前须人耳复核——索引里逐条标注了 low 与候选排名，复核结论随配乐报告归档（不许把机器标签当已核验事实）。求值语义：`low_confidence_count` 缺失会抛异常，运行时按 block 处理（fail-closed），因此调用方打标后必须带上该计数（与 G-BGM4 同一纪律）。
