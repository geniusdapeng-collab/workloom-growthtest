# 社媒×GEO 双域融合经营基线围栏包（双域 17 条 + 获客用增 6 条 = 23 条基线，全部只可加严）
# 单调守卫（F2.3）：is_baseline=true 的规则，任何上层 patch 只可收紧不可放宽
# DSL 求值语义：match 命中后求值 when 表达式（沙箱，禁任意代码）；
#   命中 → 按 level 判定；block 优先于 review 优先于 auto（deny 优先并集求值）；
#   写类动作无任何规则命中 → 按 default_level 处理；求值异常 → 按 block（宁可错杀）
# 三大纪律：① GEO 灰帽零容忍（G-GEO3 熔断）；② 事实红线一票否决（G-GEO2）；③ 涉人设/品牌表态强制 L4（G20）
version: geo-growth-baseline/v1
default_level: review
# GR-03（2026-09-28 真机审计）· 无法由工具触发的红线与原因
# 装配检查单会逐条核对「block + is_baseline 的规则是否可能被任一岗位写工具触发」；
# 下列规则在当前工具体系里**没有任何工具会产生对应动作**，因此显式声明为"未接线"，
# 而不是让规则静默空膛（声明会进装配报告留痕；一旦对应工具落地，从这里删除即可）。
unwired_blocks:
  - rule_id: G16
    reason: 账号登录/会话绑定类动作当前无任何岗位工具（矩阵账号自动化工具尚未落地）
    owner: 平台工程
  - rule_id: G17
    reason: 围栏/宪章放宽走审批激活链（fence.rule.propose → L4 审批），不经 Quest 判定器求值
    owner: 平台工程
rules:
  # ---- 社媒域（沿用 ai-video 基线口径，双域版重声明） ----
  - rule_id: G9
    name: 公网发布必审
    level: review
    is_baseline: true
    match:
      object_types: [publish_task]
      actions: [publish.execute]
    when: "true"
    note: 社媒多平台发布必审（G9 系列纪律之首）

  - rule_id: G9a
    name: 新平台首发必审
    level: review
    is_baseline: true
    match:
      object_types: [publish_task]
      actions: [publish.execute]
    when: "context.platform_first_use == true"
    note: 某账号在某平台首次发布必审，与 G9 并集取严

  - rule_id: G9b
    name: 单账号日发布超限熔断
    level: block
    is_baseline: true
    match:
      object_types: [publish_task, source_task, publish_job]
      actions: [publish.execute, rpa.publish, rpa.source_publish]
    when: "context.account_daily_published >= 5"
    note: 单账号日发布上限 5 条，超限熔断+告警（RPA 风控纪律）

  - rule_id: G10a
    name: 夸赞/感谢类评论回复自动
    level: auto
    is_baseline: true
    match:
      object_types: [comment_reply]
      actions: [comment.reply]
    when: "params.intent in ['praise', 'thanks']"
    note: 评论四档分流一档：夸赞/感谢自动回（模板库内措辞）

  - rule_id: G10b
    name: 咨询/售后类评论回复必审
    level: review
    is_baseline: true
    match:
      object_types: [comment_reply]
      actions: [comment.reply]
    when: "params.intent in ['consult', 'after_sale']"
    note: 评论四档分流二档：咨询/售后 review，可转人工

  - rule_id: G10c
    name: 负面/投诉/维权类评论回复必审+告警
    level: review
    is_baseline: true
    match:
      object_types: [comment_reply]
      actions: [comment.reply]
    when: "params.intent in ['negative', 'crisis'] or contains_any(params.text, ['投诉', '维权', '退款', '骗子', '举报'])"
    note: 评论四档分流三档：负面/危机 review 并触发告警；涉人设回应升级 G20

  - rule_id: G10d
    name: 敏感内容评论回复禁止
    level: block
    is_baseline: true
    match:
      object_types: [comment_reply, comment, review]
      actions: [comment.reply, reply.draft, dm.reply]
    when: "params.intent == 'sensitive'"
    note: 评论四档分流四档：敏感内容 block，只写「需介入」事件，不自动外发

  - rule_id: G12
    name: 投放加投必审
    level: review
    is_baseline: true
    match:
      # ads_campaign = 行业对象模型里的投放计划主档；ads = 通用任务规划器按工具名前缀
      # （ads.watch/ads.boost）派生的投放对象视图。两种命名都要覆盖，否则规划器跑出的
      # ads.boost 事件对象类型匹配不上本规则，加投就绕过 G12 的对象维度（真机验收发现）。
      object_types: [ads_campaign, ads]
      actions: [ads.boost]
    when: "true"
    note: 任何追加投流预算动作必审（涉预算纪律，不可降级为 auto）

  - rule_id: G15
    name: 对外商务文件必审
    level: review
    is_baseline: true
    match:
      object_types: [commercial_doc, deal_order]
      actions: [doc.send_external, deal.send_external]
    when: "params.doc_type in ['quote', 'closure_report', 'commitment', 'contract']"
    note: 报价/结案/承诺/合同等对外商务文件必审后外发（私域域），不得自动发送

  - rule_id: G16
    name: 矩阵账号异常登录与防关联违规
    level: block
    is_baseline: true
    match:
      object_types: [account_metric]
      actions: [account.login, account.session_bind]
    when: "context.login_anomaly == true or context.association_risk == true"
    note: 出海刚需：异常登录（异地/新设备/频繁切换）或防关联违规（共用环境/批量同频操作）直接阻断并挂起该账号全部自动动作

  # ---- GEO 域（新增） ----
  - rule_id: G-GEO1
    name: GEO 内容外发必审
    level: review
    is_baseline: true
    match:
      object_types: [geo_content]
      actions: [geo.publish]
    when: "true"
    note: AI 答案版内容（问答式/清单式/对比式）外发知乎/百科/新闻源/垂媒/公众号前必审；社媒审传播力、GEO 审事实与结构，双审制不省

  - rule_id: G-GEO2
    name: 事实红线一票否决
    level: block
    is_baseline: true
    match:
      # content = 规划器按 content.* 工具前缀派生的对象视图（S9 别名并集；只收紧）
      object_types: [geo_content, script_package, platform_variant, content]
      actions: [content.submit, geo.publish, geo.rewrite, script.draft, reply.draft]
    when: "context.fact_check_passed != true"
    note: ProductTruthChecker：宣称不得超出官方口径、创意前提与产品真实使用前提必须自洽、品牌实体信息与实体卡逐字一致；任一不符一票否决，双域通用

  - rule_id: G-GEO3
    name: GEO 灰帽手段熔断
    level: block
    is_baseline: true
    match:
      object_types: [geo_content, citation_source]
      actions: [geo.publish, source.submit, geo.boost, rpa.publish, rpa.source_publish]
    when: "params.technique in ['corpus_pollution', 'fake_multi_source', 'machine_seeding', 'mass_ai_spam']"
    note: 灰帽零容忍：语料污染/伪造多源/机器刷量/批量 AI 垃圾内容命中即熔断+告警；我们承诺「可测量可追溯」，不承诺「保证上榜」

  - rule_id: G-GEO4
    name: 单账号信源日发超限熔断
    level: block
    is_baseline: true
    match:
      object_types: [source_task]
      actions: [geo.publish, rpa.source_publish]
    when: "context.account_daily_source_published >= 3"
    note: 信源组对称 G9b 纪律：单账号信源平台日发上限 3 条（信源平台对批量发帖更敏感），超限熔断+告警；宪章 geo_publish_per_day_cap 为其上限来源

  # ---- 双域通用 ----
  - rule_id: G20
    name: 涉人设/品牌表态内容强制 L4 人审
    level: block
    is_baseline: true
    match:
      # content / comment = 规划器按工具前缀派生的对象视图（S9 别名并集；只收紧）
      object_types: [geo_content, comment_reply, publish_task, content, comment]
      actions: [content.submit, comment.reply, publish.execute, rpa.publish, rpa.source_publish, reply.draft, geo.rewrite, script.draft]
    when: "params.involves_persona == true or params.involves_brand_stance == true"
    note: 涉人设/品牌表态内容阻断一切自动外发，强制 L4 人审后由人执行；AI 不替客户做人格化承诺

  - rule_id: G17
    name: 自治边界放宽必须 L4（只紧不松）
    level: block
    is_baseline: true
    match:
      object_types: [fence_rule]
      actions: [fence.relax, charter.relax]
    when: "context.l4_approved != true"
    note: 围栏/宪章任何放宽未经 L4 批准即阻断；收紧方向不受限（单调守卫）

  - rule_id: G18
    name: 熔断触发即时通知+边界快照
    level: auto
    is_baseline: true
    match:
      object_types: [circuit_breaker]
      actions: [breaker.trigger]
    when: "true"
    note: 任何熔断触发自动执行三件套：即时通知决策人、生成边界快照、事件链留痕；不得静默熔断

  # ---- 获客用增班组（Growth Squad · v1.2 决策：预算带/价格承诺/实验登记/停止条件/转介防作弊/数据边界） ----
  - rule_id: G-GROW1
    name: 预算再分配超带必审
    level: review
    is_baseline: true
    match:
      object_types: [budget_ledger]
      actions: [budget.allocate.write, budget.recommend.write]
    when: "params.single_experiment_pct > 5 or params.monthly_reallocation_pct > 20 or params.risk_exposure_pct > 15"
    note: 预算带内自主（单实验 ≤5% / 月内再分配 ≤20% / 在跑实验风险敞口 ≤15%）；任一超带转 L4 人审，台账留痕

  - rule_id: G-GROW2
    name: 价格/绑定承诺/现金激励必审
    level: review
    is_baseline: true
    match:
      object_types: [offer, price_change, commitment, coupon_sku, referral]
      actions: [price.change, coupon.publish, commitment.make, discount.grant, referral.reward]
    when: "true"
    note: 价格/绑定承诺/现金激励类动作永远 L4，不因实验次数达标而放开；非绑定 offer 框架与承接变体走实验卡（G-GROW3）

  - rule_id: G-GROW3
    name: 实验未登记禁止执行
    level: block
    is_baseline: true
    match:
      object_types: [experiment]
      actions: [experiment.start, experiment.execute, experiment.card.write, experiment.result.write, experiment.backlog.write]
    when: "params.registered != true"
    note: 无实验卡（假设/判据/样本/预算/停止条件/伦理边界）禁止开跑；登记后方可执行（增长实验官纪律）

  - rule_id: G-GROW4
    name: 实验停止条件触发自动停止+留痕
    level: auto
    is_baseline: true
    match:
      object_types: [experiment, circuit_breaker]
      actions: [experiment.stop, experiment.guard]
    when: "params.stop_condition_hit == true"
    note: 亏损/时间/护栏任一停止条件触发即自动停止并落边界快照，不得拖延；与 G18 熔断通知同口径

  - rule_id: G-GROW5
    name: 转介防作弊熔断
    level: block
    is_baseline: true
    match:
      object_types: [referral]
      actions: [referral.grant, referral.program.write]
    when: "params.risk_score >= 0.8 or params.self_referral == true or params.device_collision == true"
    note: 自荐、设备撞库、异常批量等高风险转介奖励熔断并转人审；正常转介按激励规则执行

  - rule_id: G-GROW6
    name: 增长数据边界
    level: block
    is_baseline: true
    match:
      object_types: [growth_dataset, experiment_data]
      actions: [data.export, data.share, audience.upload, report.client, partner.outreach.write, matrix.plan.write]
    when: "context.data_boundary_ok != true"
    note: 实验与客资数据不出客户边界；导出/共享/人群上传未经数据边界确认即阻断（与 D19 上行红线同口径）

  - rule_id: G-GROW7
    name: 生命周期岗条件激活门禁
    level: block
    is_baseline: true
    match:
      object_types: [lifecycle_program, referral]
      actions: [lifecycle.program.write, lifecycle.touch.write, referral.program.write]
    when: "context.p2_activated != true"
    note: P2 条件岗默认不出场；触发条件（非酒店包 / 多店多品牌 / guest-success 超限）经 L4 激活后放行；酒店单店住客生命周期归 guest-success，避免重复触达

  - rule_id: G-GROW8
    name: 渠道增长岗条件激活门禁
    level: block
    is_baseline: true
    match:
      object_types: [partnership]
      actions: [partnership.plan.write, partner.outreach.write, matrix.plan.write]
    when: "context.p2_activated != true"
    note: 渠道增长岗按客户规模启用；多账号矩阵/多区域投放规模未达且未激活时写动作一律阻断，激活走 L4

  # ---- 人审边界（2026-09-21 产品所有者口径）----------------------------------------------
  # 原则：**数字员工之间的日常生产协作不设人审**；人审只留给两类事：① 业务决策（对外发布、
  # 投放加投、定价/合同、对外发文档…）；② 花钱或消耗预算**超出设定范围**的时候。
  # 背景：真机实测视频任务在「生产编排员 → 文案脚本 → 分镜 → 拍摄清单 → 成片」这一串内部流转上
  # 每步都被挂起等审批（运行时 default_level: review 兜底所致），把日常协作误判成高风险动作；
  # 且 LLM 规划器会自造动作名（emit_shotlist / shotlist 这类），词表必须覆盖动词族而非单点。
  # 口径：G-C01 显式 auto 放行内部协作；G-C02 兜住花钱/预算动作与付费生成（并集取严）。
  # 注意：条件表达式里**不做缺失路径的数值比较**（缺失 → 求值异常 → 引擎按 block 处理），
  # 因此花钱判定只用 `in` / `==` 这类宽容语义，数值阈值门禁留在成本账本与 G11/G12。
  - rule_id: G-C01
    name: 员工日常生产协作放行（不设人审）
    level: auto
    is_baseline: true
    match:
      # 对象词表（2026-09-24 对齐**真实对象模型**）：只列三包 `schemas/objects.json` 已声明、
      # 或管线步骤真实产出的生产类对象 + 基座运行时对象（thread / task）。
      # 旧词表里 script / storyboard / shotlist / video / media / asset / audio / voiceover / subtitle /
      # deliverable / production 等 19 个词在任何 bundle 都未声明，属"幽灵词表"：
      # 既让 `suite:geo` 的对象模型校验长期报红（G-C01 引用未声明对象），又给人"这些对象已纳管"的错觉。
      # 纪律：**不把订单/发票/合同类对象纳入本放行门**（它们由各自的钱与对外规则人审，取严优先）。
      object_types: [scene_card, shot_card, script_blueprint, script_package, shoot_list, prompt_package, portrait_set, video_project, video_asset, final_video, render_script, render_job, subtitle_track, subtitle_report, bgm_track, bgm_report, color_report, voice_profile, voice_track, voice_report, content, content_calendar, platform_variant, topic_card, thread, task]
      actions: [archive, archive_asset, archive_audio, archive_brief, archive_caption, archive_clip, archive_copy, archive_image, archive_plan, archive_script, archive_shootlist, archive_shotlist, archive_storyboard, archive_subtitle, archive_video, archive_voiceover, assemble, assemble_asset, assemble_audio, assemble_brief, assemble_caption, assemble_clip, assemble_copy, assemble_image, assemble_plan, assemble_script, assemble_shootlist, assemble_shotlist, assemble_storyboard, assemble_subtitle, assemble_video, assemble_voiceover, caption, caption_asset, caption_audio, caption_brief, caption_caption, caption_clip, caption_copy, caption_image, caption_plan, caption_script, caption_shootlist, caption_shotlist, caption_storyboard, caption_subtitle, caption_video, caption_voiceover, compose, compose_asset, compose_audio, compose_brief, compose_caption, compose_clip, compose_copy, compose_image, compose_plan, compose_script, compose_shootlist, compose_shotlist, compose_storyboard, compose_subtitle, compose_video, compose_voiceover, decompose, decompose_asset, decompose_audio, decompose_brief, decompose_caption, decompose_clip, decompose_copy, decompose_image, decompose_plan, decompose_script, decompose_shootlist, decompose_shotlist, decompose_storyboard, decompose_subtitle, decompose_video, decompose_voiceover, draft, draft_asset, draft_audio, draft_brief, draft_caption, draft_clip, draft_copy, draft_image, draft_plan, draft_script, draft_shootlist, draft_shotlist, draft_storyboard, draft_subtitle, draft_video, draft_voiceover, edit, edit_asset, edit_audio, edit_brief, edit_caption, edit_clip, edit_copy, edit_image, edit_plan, edit_script, edit_shootlist, edit_shotlist, edit_storyboard, edit_subtitle, edit_video, edit_voiceover, emit, emit_asset, emit_audio, emit_brief, emit_caption, emit_clip, emit_copy, emit_image, emit_plan, emit_script, emit_shootlist, emit_shotlist, emit_storyboard, emit_subtitle, emit_video, emit_voiceover, generate, generate_asset, generate_audio, generate_brief, generate_caption, generate_clip, generate_copy, generate_image, generate_plan, generate_script, generate_shootlist, generate_shotlist, generate_storyboard, generate_subtitle, generate_video, generate_voiceover, handoff, handoff_asset, handoff_audio, handoff_brief, handoff_caption, handoff_clip, handoff_copy, handoff_image, handoff_plan, handoff_script, handoff_shootlist, handoff_shotlist, handoff_storyboard, handoff_subtitle, handoff_video, handoff_voiceover, media.assemble, media.pack, pack, pack_asset, pack_audio, pack_brief, pack_caption, pack_clip, pack_copy, pack_image, pack_plan, pack_script, pack_shootlist, pack_shotlist, pack_storyboard, pack_subtitle, pack_video, pack_voiceover, plan, plan_asset, plan_audio, plan_brief, plan_caption, plan_clip, plan_copy, plan_image, plan_plan, plan_script, plan_shootlist, plan_shotlist, plan_shots, plan_storyboard, plan_subtitle, plan_video, plan_voiceover, qc, qc_asset, qc_audio, qc_brief, qc_caption, qc_clip, qc_copy, qc_image, qc_plan, qc_script, qc_shootlist, qc_shotlist, qc_storyboard, qc_subtitle, qc_video, qc_voiceover, render, render_asset, render_audio, render_brief, render_caption, render_clip, render_copy, render_image, render_plan, render_script, render_shootlist, render_shotlist, render_storyboard, render_subtitle, render_video, render_voiceover, review, review_asset, review_audio, review_brief, review_caption, review_clip, review_copy, review_image, review_plan, review_script, review_shootlist, review_shotlist, review_storyboard, review_subtitle, review_video, review_voiceover, scripting, scripting_asset, scripting_audio, scripting_brief, scripting_caption, scripting_clip, scripting_copy, scripting_image, scripting_plan, scripting_script, scripting_shootlist, scripting_shotlist, scripting_storyboard, scripting_subtitle, scripting_video, scripting_voiceover, shootlist, shootlist_asset, shootlist_audio, shootlist_brief, shootlist_caption, shootlist_clip, shootlist_copy, shootlist_image, shootlist_plan, shootlist_script, shootlist_shootlist, shootlist_shotlist, shootlist_storyboard, shootlist_subtitle, shootlist_video, shootlist_voiceover, shotlist, shotlist_asset, shotlist_audio, shotlist_brief, shotlist_caption, shotlist_clip, shotlist_copy, shotlist_image, shotlist_plan, shotlist_script, shotlist_shootlist, shotlist_shotlist, shotlist_storyboard, shotlist_subtitle, shotlist_video, shotlist_voiceover, storyboard, storyboard_asset, storyboard_audio, storyboard_brief, storyboard_caption, storyboard_clip, storyboard_copy, storyboard_image, storyboard_plan, storyboard_script, storyboard_shootlist, storyboard_shotlist, storyboard_storyboard, storyboard_subtitle, storyboard_video, storyboard_voiceover, subcall, subcall_asset, subcall_audio, subcall_brief, subcall_caption, subcall_clip, subcall_copy, subcall_image, subcall_plan, subcall_script, subcall_shootlist, subcall_shotlist, subcall_storyboard, subcall_subtitle, subcall_video, subcall_voiceover, subtitle, subtitle_asset, subtitle_audio, subtitle_brief, subtitle_caption, subtitle_clip, subtitle_copy, subtitle_image, subtitle_plan, subtitle_script, subtitle_shootlist, subtitle_shotlist, subtitle_storyboard, subtitle_subtitle, subtitle_video, subtitle_voiceover, visualwrite.generate]
    when: "true"
    note: 数字员工之间的日常流转（脚本/分镜/拍摄清单/成片/物料/质检/交接）自动放行；对外发布、投放加投、定价合同、对外发文档仍由各自规则人审

  - rule_id: G-C02
