  - rule_id: G-C04
    name: 素材制作渲染提交放行（不设人审）
    level: auto
    is_baseline: true
    match:
      # 对象词表（2026-09-24 对齐真实对象模型）：素材制作/渲染提交只涉及这几类真实对象
