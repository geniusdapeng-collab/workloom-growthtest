.static-gate: &static_gate
  name: static-gate
  docker:
    image: node:24.19.0-bookworm
    volumes:
      - /cnb-cache/pnpm-store:copy-on-write
  env:
    LLM_PROVIDER: mock
    IM_DRIVER: mock
    TOOL_UNVERIFIED_RATE: "0"
  stages:
    - name: 依赖安装（frozen lockfile）
      script: |
        set -eu
        corepack enable
        corepack prepare pnpm@10.14.0 --activate
        pnpm config set store-dir /cnb-cache/pnpm-store
        pnpm install --frozen-lockfile

    - name: 协议门禁（提交规范 + 并发冲突）
      script: |
        set -eu
        node --test scripts/ci/protocol-rules.test.mjs scripts/ci/verify-commit-msg.test.mjs scripts/ci/verify-lock-conflict.test.mjs
        node --test scripts/ci/cnb-desktop-release.test.mjs
        # 硬闸口径（T-2026-0930-0015）：创作/审美口径不得写成 hard: true（硬闸只允许事实类）
        node --test scripts/ci/hard-gate-policy.test.mjs
        node scripts/ci/verify-hard-gate-policy.mjs
        node scripts/ci/verify-commit-msg.mjs --self-test
        node scripts/ci/verify-lock-conflict.mjs --self-test
        # PR 范围不能在浅历史上漏检；完整 checkout 无需额外网络请求。
        if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
          git fetch --no-tags --unshallow origin
        fi
        # CNB 对已包含 target 的 source 可能做 fast-forward checkout；仍取得
        # 平台声明的 merge 对象，由 checker 核对双亲及实际工作区树完全相同。
        if [ -n "${CNB_PULL_REQUEST_MERGE_SHA:-}" ]; then
          checked_merge_sha=$CNB_PULL_REQUEST_MERGE_SHA
          test "${#checked_merge_sha}" -eq 40
          case "$checked_merge_sha" in *[!0-9a-fA-F]*) exit 1 ;; esac
          git cat-file -e "${checked_merge_sha}^{commit}" 2>/dev/null || git fetch --no-tags origin "$checked_merge_sha"
        fi
        node scripts/ci/verify-commit-msg.mjs
        node scripts/ci/verify-lock-conflict.mjs

    - name: 开源组件清单一致性（oss-watch）
      script: |
        set -eu
        # 依赖变更（package.json / pnpm-lock.yaml / requirements.txt）必须同步刷新清单；
        # 未刷新即红灯：node scripts/oss-inventory.mjs --write 后一并提交。
        node --test scripts/oss-inventory.test.mjs
        pnpm oss:check

    - name: 产品身份与行业包治理（含内置角色资产与声明一致性）
      script: |
        set -eu
        pnpm product:verify
        # 内置默认模特「陈卓」随仓分发（bundles/ai-video/library/characters/**）：守住「资产在 + 声明在」——
        # 默认模特可解析、四角度定妆照齐备、声明在首页/文档/能力清单/目录说明同步存在。
        # 背景：新下载项目的开发者与 AI Agent 常以为"仓库里没有人物资产"而重复建档（T-2026-0925-0004/0006）。
        node scripts/verify-builtin-character-assets.mjs

    - name: 三端生产构建
      script: |
        set -eu
        pnpm -C apps/web build
        pnpm -C apps/webb build
        pnpm -C apps/webc build

    - name: 交付证据、预算与行业配置回归
      script: |
        set -eu
        # The CLI fixture drops ambient NODE_PATH; expose only the pinned test package.
        instrumentation_dir=$(mktemp -d)
        playwright_link_created=0
        trap 'if [ "$playwright_link_created" = 1 ]; then rm -f node_modules/playwright; fi; rm -rf "$instrumentation_dir"' EXIT HUP INT TERM
        npm install --prefix "$instrumentation_dir" playwright@1.63.0 --ignore-scripts --no-audit --no-fund
        if [ ! -e node_modules/playwright ] && [ ! -L node_modules/playwright ]; then
          ln -s "$instrumentation_dir/node_modules/playwright" node_modules/playwright
          playwright_link_created=1
        fi
        pnpm test:governance
        node scripts/generate-capabilities.mjs --check
        # 本仓契约校验不登录、不派单、不调用模型；业务能力保持未验证。
        node scripts/acceptance/profile-check.mjs
        node scripts/acceptance/outcome.mjs --validate-only
        node scripts/runtime-deps-lock.mjs verify

    - name: 媒体真实解码与完整 CLI 回归（隔离夹具）
      script: |
        set -eu
        instrumentation_dir=$(mktemp -d)
        trap 'rm -rf "$instrumentation_dir"' EXIT HUP INT TERM
        npm install --prefix "$instrumentation_dir" playwright@1.63.0 --ignore-scripts --no-audit --no-fund
        export PLAYWRIGHT_BROWSERS_PATH="$instrumentation_dir/browsers"
        node "$instrumentation_dir/node_modules/playwright/cli.js" install --with-deps chromium
        export NODE_PATH="$instrumentation_dir/node_modules${NODE_PATH:+:$NODE_PATH}"
        pnpm test:media

.db-gate: &db_gate
  name: db-gate
  docker:
    image: pgvector/pgvector:pg17
    volumes:
      - /cnb-cache/pnpm-store:copy-on-write
      - /cnb-cache/node:copy-on-write
  env:
    LLM_PROVIDER: mock
    IM_DRIVER: mock
    RUN_DB_TESTS: "1"
    TOOL_UNVERIFIED_RATE: "0"
  stages:
    - name: 准备 Node 24 与 pnpm
      script: |
        set -eu
        NODE_VERSION=v24.19.0
        apt-get update -qq
        apt-get install -y -qq curl xz-utils ca-certificates git >/dev/null
        if [ ! -x /cnb-cache/node/bin/node ]; then
          mkdir -p /cnb-cache/node
          curl -fsSL "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-linux-x64.tar.xz" -o /tmp/node.tar.xz
          tar -xJf /tmp/node.tar.xz -C /cnb-cache/node --strip-components=1
        fi
        for bin in /cnb-cache/node/bin/*; do ln -sf "$bin" /usr/local/bin/; done
        corepack enable --install-directory /usr/local/bin
        corepack prepare pnpm@10.14.0 --activate
        pnpm config set store-dir /cnb-cache/pnpm-store
        pnpm install --frozen-lockfile

    - name: 启动 PostgreSQL 17 + pgvector
      script: |
        set -eu
        export PGDATA=/var/lib/postgresql/data
        if [ ! -s "${PGDATA}/PG_VERSION" ]; then
          mkdir -p "${PGDATA}"; chown -R postgres:postgres "${PGDATA}"
          su postgres -c "initdb -D ${PGDATA} -U postgres --auth=trust --encoding=UTF8"
        fi
        su postgres -c "pg_ctl -D ${PGDATA} -l /tmp/postgres.log -o '-c listen_addresses=localhost -c port=5432' start"
        for i in $(seq 1 60); do
          if pg_isready -h localhost -p 5432 -U postgres >/dev/null 2>&1; then break; fi
          sleep 1
        done
        pg_isready -h localhost -p 5432 -U postgres
        if ! psql -h localhost -p 5432 -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname='workloom'" | grep -q 1; then
          psql -h localhost -p 5432 -U postgres -c "CREATE DATABASE workloom OWNER postgres;" >/dev/null
        fi
        psql -h localhost -p 5432 -U postgres -d workloom -c "CREATE EXTENSION IF NOT EXISTS vector;" >/dev/null

    - name: 迁移 + 种子（幂等复跑）+ 哈希链
      script: |
        set -eu
        cp .env.example .env
        set -a
        while IFS= read -r line; do
          case "$line" in ''|\#*) continue ;; esac
          export "$line"
        done < .env
        set +a
        pnpm db:migrate
        pnpm db:seed
        pnpm db:seed
        pnpm db:verify-chain

# DEF-P1-0015 债务已清偿（2026-09-18 审计）：typecheck 全仓零错误、ui-contract 通过、
# 真库用例与全场景套件全绿，故 test-gate 转为必需门禁（不再 allowFailure）。
.test-gate: &test_gate
  name: test-gate
  docker:
    image: pgvector/pgvector:pg17
    volumes:
      - /cnb-cache/pnpm-store:copy-on-write
      - /cnb-cache/node:copy-on-write
  env:
    LLM_PROVIDER: mock
    IM_DRIVER: mock
    RUN_DB_TESTS: "1"
    TOOL_UNVERIFIED_RATE: "0"
    # 真库契约/E2E 套件要求显式指定夹具工作区（缺省时它们会 fail-closed 抛错跳过，
    # 这正是此前这些用例从未真正跑过的原因）。值与 db:seed 的演示工作区一致。
    SERVICE_C_TEST_WORKSPACE_ID: ws-yunqi
  stages:
    - name: 准备 Node 24 与 pnpm
      script: |
        set -eu
        NODE_VERSION=v24.19.0
        apt-get update -qq
        # Media contract tests decode actual fixtures instead of skipping when tools are absent.
        apt-get install -y -qq curl xz-utils ca-certificates git ffmpeg >/dev/null
        ffmpeg -version
        ffprobe -version
        if [ ! -x /cnb-cache/node/bin/node ]; then
          mkdir -p /cnb-cache/node
          curl -fsSL "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-linux-x64.tar.xz" -o /tmp/node.tar.xz
          tar -xJf /tmp/node.tar.xz -C /cnb-cache/node --strip-components=1
        fi
        for bin in /cnb-cache/node/bin/*; do ln -sf "$bin" /usr/local/bin/; done
        corepack enable --install-directory /usr/local/bin
        corepack prepare pnpm@10.14.0 --activate
        pnpm config set store-dir /cnb-cache/pnpm-store
        pnpm install --frozen-lockfile
        export PGDATA=/var/lib/postgresql/data
        if [ ! -s "${PGDATA}/PG_VERSION" ]; then
          mkdir -p "${PGDATA}"; chown -R postgres:postgres "${PGDATA}"
          su postgres -c "initdb -D ${PGDATA} -U postgres --auth=trust --encoding=UTF8"
        fi
        su postgres -c "pg_ctl -D ${PGDATA} -l /tmp/postgres.log -o '-c listen_addresses=localhost -c port=5432' start"
        for i in $(seq 1 60); do
          if pg_isready -h localhost -p 5432 -U postgres >/dev/null 2>&1; then break; fi
          sleep 1
        done
        if ! psql -h localhost -p 5432 -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname='workloom'" | grep -q 1; then
          psql -h localhost -p 5432 -U postgres -c "CREATE DATABASE workloom OWNER postgres;" >/dev/null
        fi
        psql -h localhost -p 5432 -U postgres -d workloom -c "CREATE EXTENSION IF NOT EXISTS vector;" >/dev/null
        cp .env.example .env
        set -a
        while IFS= read -r line; do
          case "$line" in ''|\#*) continue ;; esac
          export "$line"
        done < .env
        set +a
        pnpm db:migrate
        pnpm db:seed

    - name: typecheck 全包（非阻断）
      script: |
        set -eu
        pnpm -r --if-present typecheck

    - name: 主测试套件（非阻断）
      script: |
        set -eu
        set -a
        while IFS= read -r line; do
          case "$line" in ''|\#*) continue ;; esac
          export "$line"
        done < .env
        set +a
        pnpm test
        # 仓库根 scripts/ 下的 vitest 用例（行业包治理门禁、套件夹具契约）不在
        # pnpm -r 的包范围内，历史上从未被任何流水线执行过；这里显式跑一遍。
        pnpm test:scripts
        # Post-only 的实际字节/字体/来源契约；测试不调用图像、视频、语音供应商。
        pnpm --filter @hyperreality/video-studio exec vitest run src/local-cover-render.test.ts
        pnpm tsx --test scripts/tools/film-existing-render-edit.test.ts

    - name: 全场景套件（非阻断）
      script: |
        set -eu
        set -a
        while IFS= read -r line; do
          case "$line" in ''|\#*) continue ;; esac
          export "$line"
        done < .env
        set +a
        pnpm suite

    - name: P0 门禁：开户即托管验收 + 围栏别名扫描（S9）
      script: |
        set -eu
        set -a
        while IFS= read -r line; do
          case "$line" in ''|\#*) continue ;; esac
          export "$line"
        done < .env
        set +a
        pnpm acceptance:onboarding
        pnpm scan:fences
        pnpm scan:knowhow

main:
  push:
    - *static_gate
    - *db_gate
    - *test_gate

  # 只由有仓库触发权限的操作者调用 api_trigger_desktop_release。
  # 请求须指定 branch=main、sha=main 当前 HEAD，env 须有 RELEASE_TAG、RELEASE_SHA、
  # PLATFORM_SIGNING=signed。三个 Pipeline 同属一个事件；publisher 等双平台 resolve。
  # 每个角色首步写 exact main/tag/SHA/CI 的本地观察；后续可接受受保护 main 的真实后继，
  # release SHA/tag/签名/五资产始终固定，当前 release SHA 的三项 CI 必须最新全绿。
  # Mac/Windows 自托管 runner 与 Node/npm/pnpm 须先配好；签名/公证/Bundle 密钥
  # 应从仅允许本仓 main + 此事件读取的 CNB KeyStore 注入，不得放在 build/start
  # 请求 env 中。KeyStore 路径尚未由平台确认，故未硬编码虚构 URL；缺任一凭据时
  # 下面的预检会失败关闭。候选经提交附件传递，保留 1 天。
  api_trigger_desktop_release:
    - name: desktop-macos
      runner:
        namespace: group
        tags:
          - workloom-growth-desktop-macos
      stages:
        - name: 校验发布身份、工具链和签名凭据
          script: |
            set -eu
            test "$(uname -s)" = Darwin
            test "$(uname -m)" = arm64
            test "$(node --version)" = v24.19.0
            test "$(npm --version)" = 11.17.0
            test "$(pnpm --version)" = 10.14.0
            test -n "${BUNDLE_SIGNING_PRIVATE_KEY:-}"
            test -n "${BUNDLE_SIGNING_KEY_ID:-}"
            test -n "${CSC_LINK:-}" && test -n "${CSC_KEY_PASSWORD:-}"
            test -n "${APPLE_ID:-}" && test -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" && test -n "${APPLE_TEAM_ID:-}"
            node scripts/ci/cnb-desktop-release.mjs preflight --receipt desktop-preflight-desktop-macos.json

        - name: 构建受信行业 Bundle、投影和 Web
          script: |
            set -eu
            export VITE_DEMO_WORKSPACE=geo-growth VITE_DEMO_MEMBER=MEM-G01
            pnpm install --frozen-lockfile
            pnpm bundle:release
            test -s build/bundle-trust.json
            pnpm projections:generate
            pnpm product:verify
            pnpm projections:check
            pnpm exec vitest run apps/web/src/voice/VoiceEngine.test.ts
            pnpm -C packages/industry-contract build
            pnpm -C apps/web build

        - name: 打包签名与公证的 arm64 DMG，执行真实首启与渲染冒烟
          script: |
            set -eu
            bash scripts/pack-electron-payload.sh --platform mac --arch arm64 --version "$RELEASE_TAG"
            pnpm exec electron-builder --mac dmg --arm64 --publish never "-c.extraMetadata.version=${RELEASE_TAG#v}"
            DMG="$(find release -maxdepth 1 -type f -name '*-mac-arm64.dmg' -print -quit)"
            test -n "$DMG"
            hdiutil verify "$DMG"
            APP="$(find release/mac-arm64 -maxdepth 1 -name '*.app' -print -quit)"
            test -n "$APP" && test -d "$APP"
            codesign --verify --deep --strict "$APP"
            xcrun stapler validate "$APP"
            RES="$APP/Contents/Resources"
            test -s "$RES/bundle-trust.json" && test -s "$RES/payload.tar.gz" && test -s "$RES/payload/PAYLOAD_VERSION"
            SMOKE_ROOT="$(mktemp -d)"
            trap 'rm -rf "$SMOKE_ROOT"' EXIT
            tar -tzf "$RES/payload.tar.gz" > "$SMOKE_ROOT/payload-list.txt"
            grep -q 'runtime/node_modules/tsx/package.json' "$SMOKE_ROOT/payload-list.txt"
            grep -q 'nats/nats-server' "$SMOKE_ROOT/payload-list.txt"
            node apps/desktop/electron/bootstrap.cjs --smoke --resources "$RES" --support "$SMOKE_ROOT/bootstrap"
            BIN="$(find "$APP/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)"
            test -n "$BIN"
            WORKLOOM_APP_SMOKE=1 WORKLOOM_SUPPORT_DIR="$SMOKE_ROOT/app" "$BIN"
            test -f "$SMOKE_ROOT/app/.bootstrapped"
            WORKLOOM_RENDER_SMOKE=1 WORKLOOM_SUPPORT_DIR="$SMOKE_ROOT/render-default" "$BIN"
            test -f "$SMOKE_ROOT/render-default/logs/render-default.json"
            WORKLOOM_RENDER_SMOKE=1 WORKLOOM_SAFE_RENDERING=1 WORKLOOM_SUPPORT_DIR="$SMOKE_ROOT/render-safe" "$BIN"
            test -f "$SMOKE_ROOT/render-safe/logs/render-safe.json"

        - name: 打包签名与公证的 x64 DMG并核验载荷
          script: |
            set -eu
            bash scripts/pack-electron-payload.sh --platform mac --arch x64 --version "$RELEASE_TAG"
            pnpm exec electron-builder --mac dmg --x64 --publish never "-c.extraMetadata.version=${RELEASE_TAG#v}"
            DMG="$(find release -maxdepth 1 -type f -name '*-mac-x64.dmg' -print -quit)"
            test -n "$DMG"
            hdiutil verify "$DMG"
            APP="$(find release/mac -maxdepth 1 -name '*.app' -print -quit)"
            test -n "$APP" && test -d "$APP"
            codesign --verify --deep --strict "$APP"
            xcrun stapler validate "$APP"
            RES="$APP/Contents/Resources"
            test -s "$RES/bundle-trust.json" && test -s "$RES/payload.tar.gz" && test -s "$RES/payload/PAYLOAD_VERSION"
            LIST="$(mktemp)"
            trap 'rm -f "$LIST"' EXIT
            tar -tzf "$RES/payload.tar.gz" > "$LIST"
            grep -q 'runtime/node_modules/tsx/package.json' "$LIST"

        - name: 封存并回读 macOS 候选 SHA-512
          script: |
            set -eu
            node scripts/ci/cnb-desktop-release.mjs stage-platform --platform macos --release-dir release --preflight-receipt desktop-preflight-desktop-macos.json
          exports:
            candidate_manifest_sha512: MACOS_CANDIDATE_MANIFEST_SHA512
        - name: 通知发布者 macOS 候选已验真
          type: cnb:resolve
          options:
            key: desktop-macos-candidate-ready
            data:
              buildId: $CNB_BUILD_ID
              manifestSha512: $MACOS_CANDIDATE_MANIFEST_SHA512
        - name: 销毁临时 CNB 令牌
          type: cnb:destroy-token

    - name: desktop-windows
      runner:
        namespace: group
        tags:
          - workloom-growth-desktop-windows
      # PG17/pgvector use a system-wide installation on a persistent runner.
      # Serialize entire Windows producers across release events before Choco/nmake.
      lock:
        key: workloom-desktop-windows-pg17-install
        expires: 64800
        wait: true
        timeout: 64800
      stages:
        - name: 校验发布身份、工具链和签名凭据
          script: |
            $ErrorActionPreference = 'Stop'
            if ([Environment]::OSVersion.Platform -ne 'Win32NT') { throw 'Windows runner required' }
            if ([Environment]::Is64BitOperatingSystem -ne $true) { throw 'Windows x64 runner required' }
            if ((node --version) -ne 'v24.19.0') { throw 'Node toolchain mismatch' }
            if ((npm --version) -ne '11.17.0') { throw 'npm toolchain mismatch' }
            if ((pnpm --version) -ne '10.14.0') { throw 'pnpm toolchain mismatch' }
            if (-not $env:BUNDLE_SIGNING_PRIVATE_KEY -or -not $env:BUNDLE_SIGNING_KEY_ID) { throw 'Bundle signing credentials missing' }
            if (-not $env:WIN_CSC_LINK -or -not $env:WIN_CSC_KEY_PASSWORD) { throw 'Windows signing credentials missing' }
            if (-not (Get-Command bash -ErrorAction SilentlyContinue)) { throw 'Git Bash required for payload assembly' }
            if (-not (Get-Command pwsh -ErrorAction SilentlyContinue)) { throw 'PowerShell 7 required for pgvector build' }
            node scripts/ci/cnb-desktop-release.mjs preflight --receipt desktop-preflight-desktop-windows.json
            if ($LASTEXITCODE -ne 0) { throw 'release preflight failed' }

        - name: 编译锁定的 PostgreSQL 与 pgvector
          script: |
            $ErrorActionPreference = 'Stop'
            & pwsh -NoProfile -File scripts/build-pgvector-win.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Windows PostgreSQL provenance build failed' }

        - name: 构建受信行业 Bundle、投影和 Web
          script: |
            $ErrorActionPreference = 'Stop'
            function Run([string]$file, [string[]]$arguments) {
              & $file @arguments
              if ($LASTEXITCODE -ne 0) { throw "$file failed with exit code $LASTEXITCODE" }
            }
            $env:VITE_DEMO_WORKSPACE = 'geo-growth'
            $env:VITE_DEMO_MEMBER = 'MEM-G01'
            Run pnpm @('install', '--frozen-lockfile')
            Run pnpm @('bundle:release')
            if (-not (Test-Path build/bundle-trust.json -PathType Leaf)) { throw 'Bundle trust ring missing' }
            Run pnpm @('projections:generate')
            Run pnpm @('product:verify')
            Run pnpm @('projections:check')
            Run pnpm @('exec', 'vitest', 'run', 'apps/web/src/voice/VoiceEngine.test.ts')
            Run pnpm @('-C', 'packages/industry-contract', 'build')
            Run pnpm @('-C', 'apps/web', 'build')

        - name: 打包 Authenticode NSIS 并执行真实首启与渲染冒烟
          script: |
            $ErrorActionPreference = 'Stop'
            function Run([string]$file, [string[]]$arguments) {
              & $file @arguments
              if ($LASTEXITCODE -ne 0) { throw "$file failed with exit code $LASTEXITCODE" }
            }
            $version = $env:RELEASE_TAG.Substring(1)
            Run bash @('scripts/pack-electron-payload.sh', '--platform', 'win', '--arch', 'x64', '--version', $env:RELEASE_TAG)
            Run pnpm @('exec', 'electron-builder', '--win', 'nsis', '--x64', '--publish', 'never', "-c.extraMetadata.version=$version")
            $installers = @(Get-ChildItem release -File -Filter '*-win-x64.exe')
            if ($installers.Count -ne 1) { throw 'Exactly one Windows installer required' }
            $appExecutables = @(Get-ChildItem release/win-unpacked -File -Filter '*.exe' | Where-Object { $_.Name -notlike '*uninstall*' })
            if ($appExecutables.Count -ne 1) { throw 'Exactly one Windows application executable required' }
            foreach ($file in @($installers[0], $appExecutables[0])) {
              $signature = Get-AuthenticodeSignature -FilePath $file.FullName
              if ($signature.Status -ne 'Valid') { throw "Authenticode validation failed for $($file.Name)" }
            }
            $resources = 'release/win-unpacked/resources'
            foreach ($required in @('bundle-trust.json', 'payload.tar.gz', 'payload/PAYLOAD_VERSION')) {
              if (-not (Test-Path (Join-Path $resources $required) -PathType Leaf)) { throw "Missing packaged resource $required" }
            }
            $listing = & tar -tzf (Join-Path $resources 'payload.tar.gz')
            if ($LASTEXITCODE -ne 0 -or -not ($listing | Select-String 'runtime/node_modules/tsx/package.json')) { throw 'Payload archive lacks tsx runtime' }
            $smokeRoot = Join-Path ([IO.Path]::GetTempPath()) ("workloom-smoke-" + $env:CNB_BUILD_ID)
            if (Test-Path $smokeRoot) { throw 'Smoke directory collision' }
            New-Item -ItemType Directory -Path $smokeRoot | Out-Null
            try {
              $env:WORKLOOM_PG_PORT = '55432'
              $env:WORKLOOM_SERVER_PORT = '58787'
              $env:WORKLOOM_WEB_PORT = '55173'
              $env:WORKLOOM_NATS_PORT = '54222'
              Run node @('apps/desktop/electron/bootstrap.cjs', '--smoke', '--resources', $resources, '--support', (Join-Path $smokeRoot 'bootstrap'))
              $appSmoke = Join-Path $smokeRoot 'app'
              $renderSmoke = Join-Path $smokeRoot 'render'
              $spawn = 'const {spawnSync}=require("node:child_process");const r=spawnSync(process.argv[1],[],{stdio:"inherit",env:{...process.env,WORKLOOM_APP_SMOKE:"1",WORKLOOM_SUPPORT_DIR:process.argv[2]}});process.exit(r.status??1)'
              Run node @('-e', $spawn, $appExecutables[0].FullName, $appSmoke)
              if (-not (Test-Path (Join-Path $appSmoke '.bootstrapped'))) { throw 'Packaged app first boot failed' }
              $render = 'const {spawnSync}=require("node:child_process");const r=spawnSync(process.argv[1],[],{stdio:"inherit",env:{...process.env,WORKLOOM_RENDER_SMOKE:"1",WORKLOOM_SUPPORT_DIR:process.argv[2]}});process.exit(r.status??1)'
              Run node @('-e', $render, $appExecutables[0].FullName, $renderSmoke)
              if (-not (Test-Path (Join-Path $renderSmoke 'logs/render-default.json'))) { throw 'Packaged render probe failed' }
            } finally {
              Remove-Item -LiteralPath $smokeRoot -Recurse -Force
            }

        - name: 封存并回读 Windows 候选 SHA-512
          script: |
            node scripts/ci/cnb-desktop-release.mjs stage-platform --platform windows --release-dir release --preflight-receipt desktop-preflight-desktop-windows.json
            if ($LASTEXITCODE -ne 0) { throw 'Windows candidate staging failed' }
          exports:
            candidate_manifest_sha512: WINDOWS_CANDIDATE_MANIFEST_SHA512
        - name: 通知发布者 Windows 候选已验真
          type: cnb:resolve
          options:
            key: desktop-windows-candidate-ready
            data:
              buildId: $CNB_BUILD_ID
              manifestSha512: $WINDOWS_CANDIDATE_MANIFEST_SHA512
        - name: 销毁临时 CNB 令牌
          type: cnb:destroy-token

    - name: desktop-publisher
      docker:
        image: node:24.19.0-bookworm
      lock:
        key: desktop-production-release
        expires: 21600
        wait: true
        timeout: 21600
      stages:
        - name: 校验 main、稳定 tag 和发布提交
          script: |
            set -eu
            node scripts/ci/cnb-desktop-release.mjs preflight --receipt desktop-preflight-desktop-publisher.json
        - name: 等待 macOS 已验真候选
          type: cnb:await
          options:
            key: desktop-macos-candidate-ready
          exports:
            buildId: MACOS_CANDIDATE_BUILD_ID
            manifestSha512: MACOS_CANDIDATE_MANIFEST_SHA512
        - name: 等待 Windows 已验真候选
          type: cnb:await
          options:
            key: desktop-windows-candidate-ready
          exports:
            buildId: WINDOWS_CANDIDATE_BUILD_ID
            manifestSha512: WINDOWS_CANDIDATE_MANIFEST_SHA512
        - name: 单一发布者创建草稿、核验五资产远端字节并公开 Latest
          script: |
            set -eu
            node scripts/ci/cnb-desktop-release.mjs publish --preflight-receipt desktop-preflight-desktop-publisher.json
        - name: 销毁临时 CNB 令牌
          type: cnb:destroy-token

"**":
  pull_request:
    - *static_gate
    - *db_gate
    - *test_gate

# 每周开源组件上游扫描（周一 07:00，CNB crontab 使用 Asia/Shanghai 时区）：
#   刷新「当前版本 + 上游最新版本」清单与更新计划；有变化即开 chore/oss-watch-* PR（扫描只刷新事实）。
#   升级由 AI 按协议 §1/§9.5 执行（门禁全绿 + 串行 + 冷却期后合并）；破坏性/大版本升级须在 PR 显著标注并按 §3 人审放行；人保留叫停与回滚权。
$:
  "crontab: 0 7 * * 1":
    - name: oss-watch-weekly
      docker:
        image: node:24.19.0-bookworm
      stages:
        - name: 扫描上游最新版本并开刷新 PR
          script: |
            set -eu
            node scripts/oss-inventory.mjs --self-test
            node scripts/oss-watch-ci.mjs --exit-zero
