.static-gate: &static_gate
  name: static-gate
  docker:
    image: node:24.19.0-bookworm
    volumes:
      - /cnb-cache/pnpm-store:copy-on-write
  env:
    LLM_PROVIDER: mock
    IM_DRIVER: mock
    TOOL_UNVERIFIED_RATE: "0"
  stages:
    - name: 依赖安装（frozen lockfile）
      script: |
        set -eu
        corepack enable
        corepack prepare pnpm@10.14.0 --activate
        pnpm config set store-dir /cnb-cache/pnpm-store
        pnpm install --frozen-lockfile

    - name: 协议门禁（提交规范 + 并发冲突）
      script: |
        set -eu
        node --test scripts/ci/protocol-rules.test.mjs
        node scripts/ci/verify-commit-msg.mjs --self-test
        node scripts/ci/verify-lock-conflict.mjs --self-test
        node scripts/ci/verify-commit-msg.mjs
        node scripts/ci/verify-lock-conflict.mjs

    - name: 开源组件清单一致性（oss-watch）
      script: |
        set -eu
        # 依赖变更（package.json / pnpm-lock.yaml / requirements.txt）必须同步刷新清单；
        # 未刷新即红灯：node scripts/oss-inventory.mjs --write 后一并提交。
        node --test scripts/oss-inventory.test.mjs
        pnpm oss:check

    - name: 产品身份与行业包治理（含内置角色资产与声明一致性）
      script: |
        set -eu
        pnpm product:verify
        # 内置默认模特「陈卓」随仓分发（bundles/ai-video/library/characters/**）：守住「资产在 + 声明在」——
        # 默认模特可解析、四角度定妆照齐备、声明在首页/文档/能力清单/目录说明同步存在。
        # 背景：新下载项目的开发者与 AI Agent 常以为"仓库里没有人物资产"而重复建档（T-2026-0925-0004/0006）。
        node scripts/verify-builtin-character-assets.mjs

    - name: 三端生产构建
      script: |
        set -eu
        pnpm -C apps/web build
        pnpm -C apps/webb build
        pnpm -C apps/webc build

.db-gate: &db_gate
  name: db-gate
  docker:
    image: pgvector/pgvector:pg17
    volumes:
      - /cnb-cache/pnpm-store:copy-on-write
      - /cnb-cache/node:copy-on-write
  env:
    LLM_PROVIDER: mock
    IM_DRIVER: mock
    RUN_DB_TESTS: "1"
    TOOL_UNVERIFIED_RATE: "0"
  stages:
    - name: 准备 Node 24 与 pnpm
      script: |
        set -eu
        NODE_VERSION=v24.19.0
        apt-get update -qq
        apt-get install -y -qq curl xz-utils ca-certificates git >/dev/null
        if [ ! -x /cnb-cache/node/bin/node ]; then
          mkdir -p /cnb-cache/node
          curl -fsSL "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-linux-x64.tar.xz" -o /tmp/node.tar.xz
          tar -xJf /tmp/node.tar.xz -C /cnb-cache/node --strip-components=1
        fi
        for bin in /cnb-cache/node/bin/*; do ln -sf "$bin" /usr/local/bin/; done
        corepack enable --install-directory /usr/local/bin
        corepack prepare pnpm@10.14.0 --activate
        pnpm config set store-dir /cnb-cache/pnpm-store
        pnpm install --frozen-lockfile

    - name: 启动 PostgreSQL 17 + pgvector
      script: |
        set -eu
        export PGDATA=/var/lib/postgresql/data
        if [ ! -s "${PGDATA}/PG_VERSION" ]; then
          mkdir -p "${PGDATA}"; chown -R postgres:postgres "${PGDATA}"
          su postgres -c "initdb -D ${PGDATA} -U postgres --auth=trust --encoding=UTF8"
        fi
        su postgres -c "pg_ctl -D ${PGDATA} -l /tmp/postgres.log -o '-c listen_addresses=localhost -c port=5432' start"
        for i in $(seq 1 60); do
          if pg_isready -h localhost -p 5432 -U postgres >/dev/null 2>&1; then break; fi
          sleep 1
        done
        pg_isready -h localhost -p 5432 -U postgres
        if ! psql -h localhost -p 5432 -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname='workloom'" | grep -q 1; then
          psql -h localhost -p 5432 -U postgres -c "CREATE DATABASE workloom OWNER postgres;" >/dev/null
        fi
        psql -h localhost -p 5432 -U postgres -d workloom -c "CREATE EXTENSION IF NOT EXISTS vector;" >/dev/null

    - name: 迁移 + 种子（幂等复跑）+ 哈希链
      script: |
        set -eu
        cp .env.example .env
        set -a
        while IFS= read -r line; do
          case "$line" in ''|\#*) continue ;; esac
          export "$line"
        done < .env
        set +a
        pnpm db:migrate
        pnpm db:seed
        pnpm db:seed
        pnpm db:verify-chain

# DEF-P1-0015 债务已清偿（2026-09-18 审计）：typecheck 全仓零错误、ui-contract 通过、
# 真库用例与全场景套件全绿，故 test-gate 转为必需门禁（不再 allowFailure）。
.test-gate: &test_gate
  name: test-gate
  docker:
    image: pgvector/pgvector:pg17
    volumes:
      - /cnb-cache/pnpm-store:copy-on-write
      - /cnb-cache/node:copy-on-write
  env:
    LLM_PROVIDER: mock
    IM_DRIVER: mock
    RUN_DB_TESTS: "1"
    TOOL_UNVERIFIED_RATE: "0"
    # 真库契约/E2E 套件要求显式指定夹具工作区（缺省时它们会 fail-closed 抛错跳过，
    # 这正是此前这些用例从未真正跑过的原因）。值与 db:seed 的演示工作区一致。
    SERVICE_C_TEST_WORKSPACE_ID: ws-yunqi
  stages:
    - name: 准备 Node 24 与 pnpm
      script: |
        set -eu
        NODE_VERSION=v24.19.0
        apt-get update -qq
        apt-get install -y -qq curl xz-utils ca-certificates git >/dev/null
        if [ ! -x /cnb-cache/node/bin/node ]; then
          mkdir -p /cnb-cache/node
          curl -fsSL "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-linux-x64.tar.xz" -o /tmp/node.tar.xz
          tar -xJf /tmp/node.tar.xz -C /cnb-cache/node --strip-components=1
        fi
        for bin in /cnb-cache/node/bin/*; do ln -sf "$bin" /usr/local/bin/; done
        corepack enable --install-directory /usr/local/bin
        corepack prepare pnpm@10.14.0 --activate
        pnpm config set store-dir /cnb-cache/pnpm-store
        pnpm install --frozen-lockfile
        export PGDATA=/var/lib/postgresql/data
        if [ ! -s "${PGDATA}/PG_VERSION" ]; then
          mkdir -p "${PGDATA}"; chown -R postgres:postgres "${PGDATA}"
          su postgres -c "initdb -D ${PGDATA} -U postgres --auth=trust --encoding=UTF8"
        fi
        su postgres -c "pg_ctl -D ${PGDATA} -l /tmp/postgres.log -o '-c listen_addresses=localhost -c port=5432' start"
        for i in $(seq 1 60); do
          if pg_isready -h localhost -p 5432 -U postgres >/dev/null 2>&1; then break; fi
          sleep 1
        done
        if ! psql -h localhost -p 5432 -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname='workloom'" | grep -q 1; then
          psql -h localhost -p 5432 -U postgres -c "CREATE DATABASE workloom OWNER postgres;" >/dev/null
        fi
        psql -h localhost -p 5432 -U postgres -d workloom -c "CREATE EXTENSION IF NOT EXISTS vector;" >/dev/null
        cp .env.example .env
        set -a
        while IFS= read -r line; do
          case "$line" in ''|\#*) continue ;; esac
          export "$line"
        done < .env
        set +a
        pnpm db:migrate
        pnpm db:seed

    - name: typecheck 全包（非阻断）
      script: |
        set -eu
        pnpm -r --if-present typecheck

    - name: 主测试套件（非阻断）
      script: |
        set -eu
        set -a
        while IFS= read -r line; do
          case "$line" in ''|\#*) continue ;; esac
          export "$line"
        done < .env
        set +a
        pnpm test
        # 仓库根 scripts/ 下的 vitest 用例（行业包治理门禁、套件夹具契约）不在
        # pnpm -r 的包范围内，历史上从未被任何流水线执行过；这里显式跑一遍。
        pnpm test:scripts

    - name: 全场景套件（非阻断）
      script: |
        set -eu
        set -a
        while IFS= read -r line; do
          case "$line" in ''|\#*) continue ;; esac
          export "$line"
        done < .env
        set +a
        pnpm suite

    - name: P0 门禁：开户即托管验收 + 围栏别名扫描（S9）
      script: |
        set -eu
        set -a
        while IFS= read -r line; do
          case "$line" in ''|\#*) continue ;; esac
          export "$line"
        done < .env
        set +a
        pnpm acceptance:onboarding
        pnpm scan:fences
        pnpm scan:knowhow

main:
  push:
    - *static_gate
    - *db_gate
    - *test_gate

"**":
  pull_request:
    - *static_gate
    - *db_gate
    - *test_gate

# 每周开源组件上游扫描（周一 07:00，CNB crontab 使用 Asia/Shanghai 时区）：
#   刷新「当前版本 + 上游最新版本」清单与更新计划；有变化即开 chore/oss-watch-* PR（扫描只刷新事实）。
#   升级由 AI 按协议 §1/§9.5 执行（门禁全绿 + 串行 + 冷却期后合并）；破坏性/大版本升级须在 PR 显著标注并按 §3 人审放行；人保留叫停与回滚权。
$:
  "crontab: 0 7 * * 1":
    - name: oss-watch-weekly
      docker:
        image: node:24.19.0-bookworm
      stages:
        - name: 扫描上游最新版本并开刷新 PR
          script: |
            set -eu
            node scripts/oss-inventory.mjs --self-test
            node scripts/oss-watch-ci.mjs --exit-zero
